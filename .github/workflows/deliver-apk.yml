name: Download verified BashaHisab APK
on:
  push:
    branches: [delivery/v2-apk]
permissions:
  contents: read
jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[deliver-v2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify and reassemble the already-built APK
        id: verify
        run: |
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          source = Path('.v2-apk-delivery')
          manifest = json.loads((source / 'manifest.json').read_text())
          assert re.fullmatch('[a-f0-9]{40}', manifest['source_commit'])
          assert re.fullmatch(r'BashaHisab-(?:v2|v3-phase-[0-3]|v3\.1-dashboard)-debug\.apk', manifest['name'])
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write('artifact_name=' + manifest['name'][:-4] + '\n')
          target = Path('download')
          target.mkdir()
          digest = hashlib.sha256()
          with (target / manifest['name']).open('wb') as output:
              for part in manifest['parts']:
                  assert re.fullmatch(r'debug\.part-[0-9]{3}', part['name'])
                  data = (source / part['name']).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == part['sha256']
                  digest.update(data)
                  output.write(data)
          assert digest.hexdigest() == manifest['sha256']
          assert (target / manifest['name']).stat().st_size == manifest['bytes']
          (target / 'BUILD-INFO.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/setup-node@v4
        if: contains(github.event.head_commit.message, 'dashboard')
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: contains(github.event.head_commit.message, 'dashboard')
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        if: contains(github.event.head_commit.message, 'dashboard')
        with:
          flutter-version: '3.35.7'
          cache: true
      - name: Prepare isolated repository integration test
        if: contains(github.event.head_commit.message, 'dashboard')
        run: |
          flutter pub get --enforce-lockfile
          npm ci --prefix tool/rules-tests
      - name: Real FlutterFire repositories against local emulators
        if: contains(github.event.head_commit.message, 'dashboard')
        id: repositories
        continue-on-error: true
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          set -o pipefail
          tool/rules-tests/node_modules/.bin/firebase emulators:exec --only auth,firestore --project demo-bashahisab --config firebase.emulator-tests.json 'flutter test tool/integration/repository_emulator_test.dart --platform chrome --dart-define=V3_ENABLED=true --reporter expanded' 2>&1 | tee emulator-repository-tests.log
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.event.head_commit.message, 'dashboard')
        with:
          name: isolated-repository-test-log
          path: emulator-repository-tests.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: "!contains(github.event.head_commit.message, 'dashboard') || steps.repositories.outcome == 'success'"
        id: apk
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: download/
          if-no-files-found: error
          retention-days: 30
      - name: Record download URL
        if: always()
        env:
          REPOSITORY_TESTS: ${{ steps.repositories.outcome }}
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          result = 'artifact_url=' + os.environ['ARTIFACT_URL'] + '\nrun_url=' + os.environ['RUN_URL'] + '\n'
          result += 'emulator_repository_tests=' + os.environ['REPOSITORY_TESTS'] + '\n'
          if os.environ['REPOSITORY_TESTS'] == 'failure':
              log = Path('emulator-repository-tests.log')
              result += '\n' + (log.read_text()[-16000:] if log.exists() else 'No test log produced.')
          Path('.v2-apk-delivery/status.txt').write_text(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Download the verified APK: ' + os.environ['ARTIFACT_URL'] + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .v2-apk-delivery/status.txt
          git commit -m '[delivery-status] Record APK verification and download URL'
          git push origin HEAD:delivery/v2-apk
