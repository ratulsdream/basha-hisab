name: Android APK
on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  apk:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [debug, release-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Install Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo '::error::Add the complete google-services.json contents as repository Actions secret GOOGLE_SERVICES_JSON. Firebase-enabled APKs cannot be built without it.'
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('/tmp/google-services.json').write_text(os.environ['GOOGLE_SERVICES_JSON'])
          PY
          python3 tool/configure_firebase.py --android /tmp/google-services.json
          rm /tmp/google-services.json
      - run: flutter pub get --enforce-lockfile
      - name: Build debug APK
        if: matrix.mode == 'debug'
        run: flutter build apk --debug
      - name: Build release-test APK (debug signing, not for store release)
        if: matrix.mode == 'release-test'
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: BashaHisab-${{ matrix.mode }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
