name: basha_hisab
description: Shared household expenses for two roommates.
publish_to: none
version: 3.1.0-dashboard+8
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  cloud_firestore: 6.10.0
  image_picker: ^1.1.2
  local_receipt_ocr:
    path: packages/local_receipt_ocr
  # pdf 3.12 requires archive <4.1; newer image releases require newer archive APIs.
  image: 4.5.4
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  share_plus: ^12.0.1
  intl: ^0.20.2
  crypto: ^3.0.6
  archive: 4.0.9
  sqflite: ^2.4.2
  pdf: 3.12.0
  cross_file: ^0.3.5+2
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.0
  firebase_messaging: ^16.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  fake_cloud_firestore:
    path: tool/test_support/fake_cloud_firestore
  firebase_auth_mocks: ^0.15.1
flutter:
  uses-material-design: true
  assets:
    - assets/tessdata/
    - assets/licenses/
    - assets/fonts/

  fonts:
    - family: BashaBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: BashaGreek
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
